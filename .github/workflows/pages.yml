# Publishes site/ (the privacy policy and the account-deletion page that the
# Google Play listing links to) to GitHub Pages.
#
# Runs when a change to site/ reaches main, or by hand from the Actions tab.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub
# Actions. Until that is set, this workflow fails at "Configure Pages".

name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling a release
# that is halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
